<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<title>Fit Coach — Guided Workouts</title>
<meta name="description" content="Voice-guided workouts in your browser: Kegel, push-ups, squats, sit-ups, boxing combos and calf raises. No account, no tracking — your data stays on your device.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    background: #f6f1e7;
    color: #423a31;
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    -webkit-user-select: none;
    user-select: none;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; margin: auto; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .sub { font-size: 13px; color: #8a7f70; margin-top: 6px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* home */
  .list { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .ex {
    background: #fffaf2;
    border: 1px solid #e8dfd0;
    border-radius: 20px;
    padding: 15px 18px;
    min-height: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform .1s ease;
    text-align: left;
    touch-action: manipulation;
  }
  .ex:active { transform: scale(.98); }
  .ex .ico { font-size: 26px; line-height: 1; }
  .ex .name { font-size: 16px; font-weight: 700; }
  .ex .desc { font-size: 12px; color: #8a7f70; margin-top: 3px; }
  .ex .go { font-size: 13px; font-weight: 600; color: #c9805e; margin-left: auto; }

  /* session */
  .ring-wrap {
    position: relative;
    width: min(230px, 60vw); height: min(230px, 60vw);
    margin: clamp(10px, 3.5vh, 26px) auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .halo {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: #f0dccd;
    transition: background .6s ease;
  }
  .halo.release { background: #e2e9da; }
  .ball {
    width: min(150px, 40vw); height: min(150px, 40vw);
    border-radius: 50%;
    background: #c9805e;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .9s cubic-bezier(.4,0,.2,1), background .6s ease;
    z-index: 1;
    padding: 10px;
  }
  .ball.release { background: #8aa37b; }
  .ball.contract { transform: scale(.72); }
  .face { display: flex; align-items: center; justify-content: center; gap: 6px; height: 16px; margin-bottom: 2px; position: relative; }
  .eye { width: 8px; height: 8px; background: #fff; border-radius: 50%; transition: height .25s ease, border-radius .25s ease; }
  .mouth {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 18px; height: 9px;
    border: 2.5px solid #fff; border-top: none;
    border-radius: 0 0 18px 18px;
    transition: all .25s ease;
  }
  .ball.contract .eye { height: 2.5px; border-radius: 2px; }
  .ball.contract .mouth { height: 5px; transform: translateX(-50%) scaleY(.6); }
  .ball.release .mouth { height: 13px; }
  .count.pop { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .phase { font-size: 17px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; line-height: 1.2; }
  .count { font-size: clamp(34px, 11vw, 44px); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

  .progress-track {
    width: 100%; height: 8px;
    background: #e8dfd0;
    border-radius: 99px;
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0%; background: #c9805e; border-radius: 99px; transition: width .3s ease; }
  .step-sub { margin-top: 10px; font-size: 13px; color: #8a7f70; min-height: 18px; }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 99px;
    padding: 13px 40px;
    min-height: 46px;
    background: #c9805e;
    color: #fff;
    cursor: pointer;
    transition: transform .1s ease;
    touch-action: manipulation;
  }
  button:active { transform: scale(.96); }
  .btn-row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .btn-ghost {
    padding: 10px 18px;
    min-height: 44px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: #8a7f70;
    border: 1px solid #e8dfd0;
  }

  .level-row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .lvl {
    padding: 10px 22px;
    min-height: 42px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: #8a7f70;
    border: 1px solid #e8dfd0;
    touch-action: manipulation;
  }
  .lvl.on { background: #c9805e; color: #fff; border-color: #c9805e; }
  .level-row.hide { display: none; }

  /* tabata setup */
  .setup {
    display: none;
    flex-wrap: wrap;
    gap: 8px 14px;
    justify-content: center;
    margin-top: 14px;
    font-size: 13px;
    color: #8a7f70;
  }
  .setup.show { display: flex; }
  .setup input {
    font-family: inherit;
    font-size: 14px;
    width: 64px;
    padding: 8px;
    min-height: 40px;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    background: #fff;
    color: #423a31;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
  }
  .setup input[type="text"] { width: 90px; text-align: left; }

  .install-btn { display: none; margin-top: 16px; }
  .install-btn.show { display: inline-block; }

  /* demo: synced stick figure */
  .demo {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 158px;
    background: #fffaf2;
    border: 1px solid #e8dfd0;
    border-radius: 20px;
    margin-top: 14px;
    transition: opacity .3s ease;
  }
  .demo.show { display: flex; }
  .demo.rest { opacity: .35; }
  #demoSvg { width: 120px; height: 120px; }
  #demoSvg g, #demoSvg line { transform-box: view-box; }
  .limb { stroke: #c9805e; stroke-width: 6; stroke-linecap: round; fill: none; }
  .limb.head { fill: #c9805e; stroke: #c9805e; }
  #figOrient { transform-origin: 60px 60px; }
  #upper { transform-origin: 60px 70px; }
  #armL, #armR { transform-origin: 60px 38px; }
  #legL, #legR { transform-origin: 60px 70px; }
  .demo-label { font-size: 12px; font-weight: 600; color: #8a7f70; letter-spacing: 1px; text-transform: uppercase; }
  .anim-squat #figOrient { animation: d-squat 2.4s ease-in-out infinite; }
  .anim-squat #legL { animation: d-legL 2.4s ease-in-out infinite; }
  .anim-squat #legR { animation: d-legR 2.4s ease-in-out infinite; }
  @keyframes d-squat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(16px); } }
  @keyframes d-legL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(30deg); } }
  @keyframes d-legR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-30deg); } }
  .anim-pushup #figOrient { animation: d-pushup 2.4s ease-in-out infinite; }
  @keyframes d-pushup { 0%, 100% { transform: rotate(90deg) translate(0, -4px); } 50% { transform: rotate(90deg) translate(0, 7px); } }
  .anim-jack #armL { animation: d-armL 1.6s ease-in-out infinite; }
  .anim-jack #armR { animation: d-armR 1.6s ease-in-out infinite; }
  .anim-jack #legL { animation: d-legL 1.6s ease-in-out infinite; }
  .anim-jack #legR { animation: d-legR 1.6s ease-in-out infinite; }
  @keyframes d-armL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-150deg); } }
  @keyframes d-armR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(150deg); } }
  .anim-crunch #upper { animation: d-crunch 2.4s ease-in-out infinite; }
  @keyframes d-crunch { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-38deg); } }
  .anim-calf #figOrient { animation: d-calf 2.2s ease-in-out infinite; }
  @keyframes d-calf { 0%, 100% { transform: translateY(0); } 40%, 60% { transform: translateY(-9px); } }
  .anim-plank #figOrient { transform: rotate(90deg) translate(4px, -6px); }
  .anim-plank #figOrient { animation: d-tremor 1.4s ease-in-out infinite; }
  @keyframes d-tremor { 0%, 100% { transform: rotate(90deg) translate(4px, -6px); } 50% { transform: rotate(90deg) translate(4px, -4.5px); } }
  .anim-wallsit #figOrient { transform: translateY(18px); }
  .anim-wallsit #legL { transform: rotate(36deg); }
  .anim-wallsit #legR { transform: rotate(-36deg); }
  .anim-knees #legL { animation: d-kneeL .9s ease-in-out infinite; }
  .anim-knees #legR { animation: d-kneeR .9s ease-in-out infinite; }
  .anim-knees #armL { animation: d-armL .9s ease-in-out infinite; }
  .anim-knees #armR { animation: d-armR .9s ease-in-out infinite; }
  @keyframes d-kneeL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(42deg); } }
  @keyframes d-kneeR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-42deg); } }
  .anim-punch #armR { animation: d-punchR 2s ease-in-out infinite; }
  .anim-punch #armL { animation: d-punchL 2s ease-in-out infinite; }
  @keyframes d-punchR { 0%, 15% { transform: rotate(0); } 25%, 38% { transform: rotate(-85deg); } 55%, 100% { transform: rotate(0); } }
  @keyframes d-punchL { 0%, 45% { transform: rotate(0); } 58%, 70% { transform: rotate(85deg); } 88%, 100% { transform: rotate(0); } }

  .history { margin-top: 22px; }
  .streak { font-size: 13px; color: #c9805e; font-weight: 600; min-height: 18px; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e8dfd0; }
  .dot.hit { background: #8aa37b; }
  .dot.today { outline: 2px solid #c9805e; outline-offset: 2px; }

  .tip { margin-top: 20px; font-size: 12px; color: #8a7f70; line-height: 1.8; }

  /* confetti */
  .confetti {
    position: absolute;
    width: 9px; height: 13px;
    border-radius: 3px;
    top: 50%; left: 50%;
    pointer-events: none;
    animation: fly 1.1s ease-out forwards;
    z-index: 5;
  }
  @keyframes fly {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  /* finish quip */
  .quip {
    margin-top: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #c9805e;
    min-height: 20px;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .quip.show { opacity: 1; animation: pop .4s ease; }

  /* short screens (iPhone SE class): compress vertical rhythm */
  @media (max-height: 680px) {
    .list { margin-top: 14px; gap: 8px; }
    .ex { padding: 12px 16px; }
    .demo { height: 118px; margin-top: 10px; }
    #demoSvg { width: 92px; height: 92px; }
    .step-sub { margin-top: 6px; }
    .history { margin-top: 14px; }
    .tip { margin-top: 12px; }
    .level-row { margin-top: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- HOME -->
  <div class="screen active" id="home">
    <h1>Fit Coach</h1>
    <p class="sub">Voice-guided workouts. Just press go.</p>
    <div class="list" id="list"></div>
    <div class="history">
      <div class="streak" id="streak"></div>
      <div class="dots" id="dots"></div>
    </div>
    <p class="tip">No account. No tracking. Your data stays on your device.</p>
    <button id="installBtn" class="btn-ghost install-btn">Install app</button>
  </div>

  <!-- SESSION -->
  <div class="screen" id="session">
    <div class="ring-wrap">
      <div class="halo" id="halo"></div>
      <div class="ball" id="ball">
        <div class="face">
          <span class="eye"></span><span class="eye"></span>
          <span class="mouth"></span>
        </div>
        <div class="phase" id="phase">Ready</div>
        <div class="count" id="count"></div>
      </div>
    </div>
    <div class="demo" id="demo">
      <svg id="demoSvg" viewBox="0 0 120 120">
        <g id="figOrient">
          <g id="upper">
            <circle cx="60" cy="20" r="9" class="limb head"/>
            <line x1="60" y1="30" x2="60" y2="70" class="limb"/>
            <line id="armL" x1="60" y1="38" x2="42" y2="60" class="limb"/>
            <line id="armR" x1="60" y1="38" x2="78" y2="60" class="limb"/>
          </g>
          <line id="legL" x1="60" y1="70" x2="47" y2="106" class="limb"/>
          <line id="legR" x1="60" y1="70" x2="73" y2="106" class="limb"/>
        </g>
      </svg>
      <div class="demo-label" id="demoLabel"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <div class="step-sub" id="stepSub"></div>    <div class="quip" id="quip"></div>
    <div class="btn-row">
      <button id="btn">Start</button>
      <button id="voiceBtn" class="btn-ghost">Voice: on</button>
      <button id="backBtn" class="btn-ghost">Back</button>
    </div>
    <div class="level-row" id="levelRow">
      <button class="lvl" data-lv="0">Light</button>
      <button class="lvl" data-lv="1">Standard</button>
      <button class="lvl" data-lv="2">Hard</button>
    </div>
    <div class="setup" id="setupPanel">
      <label>Work <input id="cfgWork" type="number" min="5" max="300" value="20">s</label>
      <label>Rest <input id="cfgRest" type="number" min="3" max="120" value="10">s</label>
      <label>Rounds <input id="cfgRounds" type="number" min="1" max="50" value="8"></label>
      <label>Name <input id="cfgName" type="text" maxlength="12" value="Work"></label>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- voice ---------- */
  var voiceOn = (function () {
    try { return localStorage.getItem("fitcoach_voice") !== "off"; } catch (e) { return true; }
  })();
  var voiceBtn = document.getElementById("voiceBtn");
  voiceBtn.textContent = voiceOn ? "Voice: on" : "Voice: off";
  voiceBtn.addEventListener("click", function () {
    voiceOn = !voiceOn;
    voiceBtn.textContent = voiceOn ? "Voice: on" : "Voice: off";
    try { localStorage.setItem("fitcoach_voice", voiceOn ? "on" : "off"); } catch (e) {}
    if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) {} }
  });
  function speak(text) {
    if (!voiceOn) { return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /* keep screen awake while training */
  var wakeLock = null;
  function requestWake() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        navigator.wakeLock.request("screen").then(function (wl) { wakeLock = wl; }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && timer) { requestWake(); }
  });

  /* ---------- step builders (level-aware: 0 light / 1 standard / 2 hard) ---------- */
  var LV = 1;
  function S(label, say, secs, cls, sub) {
    return { label: label, say: say, secs: secs, cls: cls || "idle", sub: sub || "" };
  }

  function buildKegel() {
    var setsN = [2, 3, 4][LV], repsN = [8, 10, 12][LV];
    var steps = [];
    for (var set = 1; set <= setsN; set++) {
      if (set > 1) { steps.push(S("Rest", "Rest. Next set coming up", 15, "idle", "Set " + set + " of " + setsN)); }
      for (var r = 1; r <= repsN; r++) {
        var last = (r === repsN && set === setsN);
        steps.push(S("Squeeze", last ? "Last one, squeeze" : "Squeeze", 5, "contract", "Rep " + r + "/" + repsN + " · Set " + set + "/" + setsN));
        steps.push(S("Release", "And release", 5, "release", "Rep " + r + "/" + repsN + " · Set " + set + "/" + setsN));
      }
    }
    return steps;
  }

  function buildReps(opts) {
    var repsN = Math.round(opts.reps * [0.7, 1, 1.3][LV]);
    var steps = [];
    for (var set = 1; set <= opts.sets; set++) {
      if (set > 1) { steps.push(S("Rest", "Rest. Shake it out", 30, "idle", "Set " + set + " of " + opts.sets)); }
      for (var r = 1; r <= repsN; r++) {
        var last = (r === repsN && set === opts.sets);
        steps.push(S(opts.down, last ? "Last one" : opts.downSay, opts.downSecs, "contract", "Rep " + r + "/" + repsN + " · Set " + set + "/" + opts.sets));
        steps.push(S(opts.up, opts.upSay, opts.upSecs, "release", "Rep " + r + "/" + repsN + " · Set " + set + "/" + opts.sets));
      }
    }
    return steps;
  }

  var COMBOS = [
    { t: "Jab · Cross", s: "Jab, cross" },
    { t: "Cross · Hook", s: "Cross, hook" },
    { t: "Hook · Uppercut", s: "Hook, uppercut" },
    { t: "Jab · Jab · Cross", s: "Double jab, cross" },
    { t: "Uppercut · Cross", s: "Uppercut, cross" }
  ];
  function buildBoxing() {
    var roundsN = [2, 3, 4][LV];
    var steps = [];
    for (var round = 1; round <= roundsN; round++) {
      if (round > 1) { steps.push(S("Rest", "Fifteen seconds. Breathe", 15, "idle", "Round " + round + " of " + roundsN)); }
      steps.push(S("Round " + round, round === 1 ? "Round one. Boxing stance, hands up. Go" : "Round " + round + ". Go", 5, "contract", "Round " + round + "/" + roundsN));
      for (var i = 0; i < 17; i++) {
        var c = COMBOS[Math.floor(Math.random() * COMBOS.length)];
        var say = (i % 5 === 4) ? "Move your feet" : c.s;
        var label = (i % 5 === 4) ? "Footwork" : c.t;
        steps.push(S(label, say, 5, i % 2 === 0 ? "contract" : "release", "Round " + round + "/" + roundsN));
      }
      steps.push(S("Finish", "Ten seconds. Finish strong", 5, "contract", "Round " + round + "/" + roundsN));
    }
    return steps;
  }

  function buildPlank() {
    var plan = [[20, 30, 45], [30, 45, 60], [45, 60, 90]][LV];
    var steps = [];
    for (var i = 0; i < plan.length; i++) {
      if (i > 0) { steps.push(S("Rest", "Rest. Deep breaths", 30, "idle", "Hold " + (i + 1) + " of " + plan.length)); }
      steps.push(S("Plank", i === 0 ? "Plank position. Elbows under shoulders. Go" : "Plank. Hold it", plan[i], "contract", "Hold " + (i + 1) + "/" + plan.length + " · " + plan[i] + "s"));
    }
    steps.push(S("Done soon", "And relax. Great hold", 3, "release", ""));
    return steps;
  }

  var SEVEN = [
    { t: "Jumping Jacks", s: "Jumping jacks, go" },
    { t: "Wall Sit", s: "Wall sit" },
    { t: "Push-ups", s: "Push-ups" },
    { t: "Crunches", s: "Abdominal crunches" },
    { t: "Step-ups", s: "Step-ups, use a chair" },
    { t: "Squats", s: "Squats" },
    { t: "Dips", s: "Tricep dips on a chair" },
    { t: "Plank", s: "Plank, hold strong" },
    { t: "High Knees", s: "High knees, run in place" },
    { t: "Lunges", s: "Lunges" },
    { t: "Push + Rotate", s: "Push-ups with rotation" },
    { t: "Side Plank", s: "Side plank, each side" }
  ];
  function buildSeven() {    var steps = [];
    var moves = SEVEN;
    var rounds = 1;
    if (LV === 0) { moves = SEVEN.slice(0, 6); }
    if (LV === 2) { rounds = 2; }
    steps.push(S("Get Set", "Seven minute workout. Thirty seconds per move, ten seconds rest. Ready? Go", 5, "idle", moves.length + " moves" + (rounds > 1 ? " × " + rounds : "")));
    for (var rd = 1; rd <= rounds; rd++) {
      for (var i = 0; i < moves.length; i++) {
        steps.push(S(moves[i].t, rd > 1 ? "Round two. " + moves[i].s : moves[i].s, 30, i % 2 === 0 ? "contract" : "release", "Move " + (i + 1) + "/" + moves.length + (rounds > 1 ? " · Round " + rd + "/" + rounds : "")));
        if (rd === rounds && i === moves.length - 1) { break; }
        steps.push(S("Rest", "Rest", 10, "idle", "Next: " + (i < moves.length - 1 ? moves[i + 1].t : moves[0].t)));
      }
    }
    steps.push(S("Done", "Seven minutes complete. Well earned", 3, "idle", ""));
    return steps;
  }

  function buildTabata(cfg) {
    var steps = [];
    steps.push(S("Get Set", "Custom intervals. " + cfg.name + ", " + cfg.work + " seconds each round. Ready? Go", 5, "idle", cfg.rounds + " rounds"));
    for (var r = 1; r <= cfg.rounds; r++) {
      steps.push(S(cfg.name, cfg.name + ", go", cfg.work, "contract", "Round " + r + "/" + cfg.rounds));
      if (r < cfg.rounds) { steps.push(S("Rest", "Rest", cfg.rest, "idle", "Next: " + cfg.name)); }
    }
    steps.push(S("Done", "Intervals complete. Well earned", 3, "idle", ""));
    return steps;
  }

  var WORKOUTS = [
    { id: "kegel", icon: "🧘", name: "Kegel", desc: "Pelvic floor · 3 × 10 · 5s hold", build: buildKegel },
    { id: "pushups", icon: "💪", name: "Push-ups", desc: "Chest & triceps · 3 × 10 · paced", build: function () {
        return buildReps({ sets: 3, reps: 10, down: "Down", downSay: "Down", downSecs: 2, up: "Up", upSay: "Up", upSecs: 1.5 });
      } },
    { id: "squats", icon: "🏋️", name: "Squats", desc: "Legs · 3 × 15 · slow tempo", build: function () {
        return buildReps({ sets: 3, reps: 15, down: "Sit back", downSay: "Down", downSecs: 2.5, up: "Stand tall", upSay: "Up", upSecs: 1.5 });
      } },
    { id: "situps", icon: "🔥", name: "Sit-ups", desc: "Core · 3 × 15", build: function () {
        return buildReps({ sets: 3, reps: 15, down: "Up", downSay: "Up", downSecs: 1.5, up: "Down", upSay: "And down", upSecs: 1.5 });
      } },
    { id: "boxing", icon: "🥊", name: "Boxing", desc: "Combos · 3 rounds · hands up", build: buildBoxing },
    { id: "plank", icon: "⏱️", name: "Plank", desc: "Core holds · 30 / 45 / 60s", build: buildPlank },
    { id: "7min", icon: "⚡", name: "7-Minute Workout", desc: "12 moves · full body · science-backed", build: buildSeven },
    { id: "calves", icon: "🦵", name: "Calf Raises", desc: "Calves · 3 × 20 · full range", build: function () {
        return buildReps({ sets: 3, reps: 20, down: "Up", downSay: "Up, hold", downSecs: 2, up: "Lower", upSay: "Lower", upSecs: 1.5 });
      } },
    { id: "tabata", icon: "⏲️", name: "Tabata Timer", desc: "Custom intervals · you set the clock", build: null }
  ];

  /* ---------- home ---------- */
  var listEl = document.getElementById("list");
  WORKOUTS.forEach(function (w) {
    var card = document.createElement("div");
    card.className = "ex";
    var ico = document.createElement("div");
    ico.className = "ico";
    ico.textContent = w.icon;
    var left = document.createElement("div");
    var nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = w.name;
    var descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.textContent = w.desc;
    left.appendChild(nameEl);
    left.appendChild(descEl);
    var go = document.createElement("div");
    go.className = "go";
    go.textContent = "Start";
    card.appendChild(ico);
    card.appendChild(left);
    card.appendChild(go);
    card.addEventListener("click", function () { openWorkout(w); });
    listEl.appendChild(card);
  });

  /* ---------- session engine ---------- */
  var TICK = 200;
  var homeEl = document.getElementById("home");
  var sessionEl = document.getElementById("session");
  var ball = document.getElementById("ball");
  var halo = document.getElementById("halo");
  var phaseEl = document.getElementById("phase");
  var countEl = document.getElementById("count");
  var progressEl = document.getElementById("progress");
  var stepSubEl = document.getElementById("stepSub");
  var btn = document.getElementById("btn");
  var backBtn = document.getElementById("backBtn");
  var levelRow = document.getElementById("levelRow");
  var setupPanel = document.getElementById("setupPanel");

  function loadTabataCfg() {
    try {
      var cfg = JSON.parse(localStorage.getItem("fitcoach_tabata") || "null");
      if (!cfg) { return; }
      document.getElementById("cfgWork").value = cfg.work;
      document.getElementById("cfgRest").value = cfg.rest;
      document.getElementById("cfgRounds").value = cfg.rounds;
      document.getElementById("cfgName").value = cfg.name;
    } catch (e) {}
  }

  /* level select (Down Dog style: user shapes the workout before it starts) */
  try { LV = parseInt(localStorage.getItem("fitcoach_level"), 10); if (!(LV >= 0 && LV <= 2)) { LV = 1; } } catch (e) { LV = 1; }
  var lvlBtns = levelRow.querySelectorAll(".lvl");
  function paintLevel() {
    for (var i = 0; i < lvlBtns.length; i++) {
      lvlBtns[i].className = "lvl" + (parseInt(lvlBtns[i].getAttribute("data-lv"), 10) === LV ? " on" : "");
    }
  }
  lvlBtns.forEach ? lvlBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      LV = parseInt(b.getAttribute("data-lv"), 10);
      try { localStorage.setItem("fitcoach_level", String(LV)); } catch (e) {}
      paintLevel();
      if (current) { stepSubEl.textContent = current.name + " · " + current.build().length + " cues"; }
    });
  }) : null;
  paintLevel();

  var steps = [], idx = -1, remaining = 0, timer = null, current = null;

  function look(cls, label) {
    ball.className = "ball " + cls;
    halo.className = "halo" + (cls === "release" ? " release" : "");
    phaseEl.textContent = label;
  }

  /* synced demo: stick figure mirrors the spoken cue */
  var DEMO_MAP = { pushups: "pushup", squats: "squat", situps: "crunch", boxing: "punch", plank: "plank", calves: "calf" };
  var SEVEN_DEMO = {
    "Jumping Jacks": "jack", "Wall Sit": "wallsit", "Push-ups": "pushup", "Crunches": "crunch",
    "Step-ups": "squat", "Squats": "squat", "Dips": "pushup", "Plank": "plank",
    "High Knees": "knees", "Lunges": "squat", "Push + Rotate": "pushup", "Side Plank": "plank"
  };
  var demoEl = document.getElementById("demo");
  var demoLabel = document.getElementById("demoLabel");
  function updateDemo(st) {
    var key = current.id === "7min" ? SEVEN_DEMO[st.label] : DEMO_MAP[current.id];
    if (!key) { demoEl.className = "demo"; return; }
    var cls = "demo show anim-" + key;
    if (st.label === "Rest" || st.cls === "idle") { cls += " rest"; }
    if (demoEl.className !== cls) { demoEl.className = cls; }
    demoLabel.textContent = st.label;
  }

  function openWorkout(w) {
    steps = w.build ? w.build() : [];
    idx = -1;
    current = w;
    try { history.pushState(null, "", "/" + w.id); } catch (e) {}
    homeEl.classList.remove("active");
    sessionEl.classList.add("active");
    look("idle", "Ready");
    countEl.textContent = "";
    stepSubEl.textContent = w.name + " · " + (w.id === "tabata" ? "set your timer" : steps.length + " cues");
    progressEl.style.width = "0%";
    document.getElementById("quip").classList.remove("show");
    levelRow.classList.toggle("hide", w.id === "tabata");
    setupPanel.classList.toggle("show", w.id === "tabata");
    if (w.id === "tabata") { loadTabataCfg(); }
    btn.textContent = "Start";
  }

  function goHome() {
    if (timer) { clearInterval(timer); timer = null; }
    releaseWake();
    try { speechSynthesis.cancel(); } catch (e) {}
    try { history.pushState(null, "", "/"); } catch (e) {}
    sessionEl.classList.remove("active");
    homeEl.classList.add("active");
    renderHistory();
  }

  function playStep(i) {
    idx = i;
    current.step = steps[i];
    var st = steps[i];
    look(st.cls, st.label);
    updateDemo(st);
    stepSubEl.textContent = (st.label === "Rest" && steps[i + 1]) ? "Next: " + steps[i + 1].label : st.sub;
    countEl.classList.remove("pop");
    void countEl.offsetWidth;
    countEl.classList.add("pop");
    speak(st.say);
    vibrate(st.cls === "contract" ? 60 : 30);
    remaining = st.secs;
    progressEl.style.width = Math.round((i + 1) / steps.length * 100) + "%";
  }

  function nextStep() {
    if (idx + 1 >= steps.length) { return finish(); }
    playStep(idx + 1);
  }

  function tick() {
    remaining -= TICK / 1000;
    if (remaining <= 0) { nextStep(); }
    else { countEl.textContent = String(Math.ceil(remaining)); }
  }

  function start() {
    btn.textContent = "Stop";
    if (current.id === "tabata") {
      var clamp = function (v, lo, hi, dflt) {
        v = parseInt(v, 10);
        if (isNaN(v)) { v = dflt; }
        return Math.max(lo, Math.min(hi, v));
      };
      var cfg = {
        work: clamp(document.getElementById("cfgWork").value, 5, 300, 20),
        rest: clamp(document.getElementById("cfgRest").value, 3, 120, 10),
        rounds: clamp(document.getElementById("cfgRounds").value, 1, 50, 8),
        name: (document.getElementById("cfgName").value || "").trim().slice(0, 12) || "Work"
      };
      try { localStorage.setItem("fitcoach_tabata", JSON.stringify(cfg)); } catch (e) {}
      steps = buildTabata(cfg);
      setupPanel.classList.remove("show");
    } else {
      steps = current.build();
    }
    levelRow.classList.add("hide");
    speak("Get ready");
    requestWake();
    playStep(0);
    timer = setInterval(tick, TICK);
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function stop() {
    stopTimer();
    releaseWake();
    try { speechSynthesis.cancel(); } catch (e) {}
    look("idle", "Ready");
    countEl.textContent = "";
    btn.textContent = "Start";
    if (current && current.id === "tabata") { setupPanel.classList.add("show"); }
    else { levelRow.classList.remove("hide"); }
  }

  var FINISH_LINES = [
    { q: "Nailed it!", s: "Nailed it" },
    { q: "Beast mode!", s: "Beast mode" },
    { q: "That's how it's done.", s: "That's how it's done" },
    { q: "Strong. Very strong.", s: "Strong. Very strong" },
    { q: "See you tomorrow!", s: "See you tomorrow" }
  ];

  function confetti() {
    var colors = ["#c9805e", "#8aa37b", "#e0b15e", "#b58ec9", "#6ea8c9"];
    var ring = document.querySelector(".ring-wrap");
    for (var i = 0; i < 26; i++) {
      var p = document.createElement("div");
      p.className = "confetti";
      var ang = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 90;
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", (Math.sin(ang) * dist + 60) + "px");
      p.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.15) + "s";
      ring.appendChild(p);
      (function (el) { setTimeout(function () { el.remove(); }, 1500); })(p);
    }
  }

  function finish() {
    stopTimer();
    releaseWake();
    look("idle", "Done");
    countEl.textContent = "";
    progressEl.style.width = "100%";
    btn.textContent = "Go again";
    if (current.id !== "tabata") { levelRow.classList.remove("hide"); }
    saveToday();
    var totalSecs = 0;
    for (var i = 0; i < steps.length; i++) { totalSecs += steps[i].secs; }
    var mins = Math.max(1, Math.round(totalSecs / 60));
    renderHistory();
    var streakTxt = document.getElementById("streak").textContent;
    stepSubEl.textContent = current.name + " · " + steps.length + " cues · about " + mins + " min" + (streakTxt ? " · " + streakTxt.toLowerCase() : "");
    var line = FINISH_LINES[Math.floor(Math.random() * FINISH_LINES.length)];
    var quip = document.getElementById("quip");
    quip.textContent = line.q;
    quip.classList.remove("show");
    void quip.offsetWidth;
    quip.classList.add("show");
    speak("Great job. " + line.s);
    confetti();
    vibrate([80, 60, 80]);
  }

  btn.addEventListener("click", function () {
    if (timer) { stop(); }
    else { start(); }
  });
  backBtn.addEventListener("click", goHome);

  /* ---------- history ---------- */
  function dateKey(d) {
    var pad = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function loadLog() {
    try {
      var raw = localStorage.getItem("fitcoach_log");
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveToday() {
    var log = loadLog();
    var key = dateKey(new Date());
    if (log.indexOf(key) === -1) {
      log.push(key);
      try { localStorage.setItem("fitcoach_log", JSON.stringify(log)); } catch (e) {}
    }
  }
  function renderHistory() {
    var log = loadLog();
    var set = {};
    for (var i = 0; i < log.length; i++) { set[log[i]] = true; }
    var streak = 0;
    var cursor = new Date();
    if (!set[dateKey(cursor)]) { cursor = new Date(cursor.getTime() - 86400000); }
    while (set[dateKey(cursor)]) {
      streak += 1;
      cursor = new Date(cursor.getTime() - 86400000);
    }
    document.getElementById("streak").textContent =
      streak > 0 ? "Streak: " + streak + " day" + (streak > 1 ? "s" : "") : "";
    var dots = document.getElementById("dots");
    dots.innerHTML = "";
    for (var d = 6; d >= 0; d--) {
      var day = new Date(Date.now() - d * 86400000);
      var dot = document.createElement("div");
      dot.className = "dot";
      if (set[dateKey(day)]) { dot.className += " hit"; }
      if (d === 0) { dot.className += " today"; }
      dots.appendChild(dot);
    }
  }

  renderHistory();

  /* deep link: /kegel /boxing /7min ... */
  window.addEventListener("popstate", function () { route(); });
  function route() {
    var seg = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
    if (!seg) { return; }
    for (var i = 0; i < WORKOUTS.length; i++) {
      if (WORKOUTS[i].id === seg) { openWorkout(WORKOUTS[i]); return; }
    }
  }
  route();

  /* PWA: offline + install */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
  var deferredPrompt = null;
  var installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add("show");
  });
  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) { return; }
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.classList.remove("show");
  });
})();
</script>
</body>
</html>
